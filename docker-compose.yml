services:
  mongo:
    image: mongo:7
    container_name: tabu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tabu-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tabu-mongo-data:
